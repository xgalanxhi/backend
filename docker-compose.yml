version: '3.8'

services:
  todo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-production-secret-key
      - ALGORITHM=HS256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 3s
      retries: 3
