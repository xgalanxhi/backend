apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test-backend
on:
  workflow_dispatch:
  workflow_call:
permissions:
  scm-token-own: read
  scm-token-org: read
jobs:
  test:
    steps:
      - name: Check out
        uses: cloudbees-io/checkout@v2
        with:
          path: source

      - name: Record build with Smart Tests
        uses: cloudbees-io/smart-tests-record-build@v1
        with:
          token: ${{ secrets.SMART_TESTS_KEY }}
          flavor: backend

      - name: Run tests
        uses: docker://python:3.11-slim
        shell: sh
        run: |
          set -eu
          cd source

          echo "========================================"
          echo "Backend Tests with Smart Tests"
          echo "========================================"
          echo ""

          echo "Installing dependencies..."
          pip install --quiet --no-cache-dir -r requirements.txt
          pip install --quiet --no-cache-dir -r requirements-dev.txt

          echo ""
          echo "Running tests with JUnit output..."
          # Run pytest with JUnit XML output for Smart Tests
          pytest -v \
            --junitxml=test-results/junit.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html || true

          echo ""
          echo "Validating Python syntax..."
          python -m py_compile main.py
          echo "✓ Syntax validation passed"

          echo ""
          echo "✓ Backend tests completed"

      - name: Upload test results to Smart Tests
        if: always()
        uses: cloudbees-io/smart-tests-record-tests@v1
        with:
          token: ${{ secrets.SMART_TESTS_KEY }}
          flavor: backend
          test-path: source/test-results/*.xml
