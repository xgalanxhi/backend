apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test-backend
on:
  workflow_dispatch:
  workflow_call:
permissions:
  scm-token-own: read
  scm-token-org: read
jobs:
  test:
    steps:
      - name: Check out
        uses: cloudbees-io/checkout@v2
        with:
          path: source

      - name: Record build with Launchable
        uses: docker://cloudbees/launchable:v1.120.0
        shell: sh
        env:
          LAUNCHABLE_TOKEN: ${{ secrets.SMART_TESTS_KEY }}
        run: |
          cd source
          launchable record build --name ${CLOUDBEES_RUN_ID} --source .

      - name: Run tests
        uses: docker://python:3.11-slim
        shell: sh
        run: |
          set -eu
          cd source

          echo "========================================"
          echo "Backend Tests with Launchable"
          echo "========================================"
          echo ""

          echo "Installing dependencies..."
          pip install --quiet --no-cache-dir -r requirements.txt
          pip install --quiet --no-cache-dir -r requirements-dev.txt

          echo ""
          echo "Running tests with JUnit output..."
          mkdir -p test-results
          # Run pytest with JUnit XML output for Launchable
          pytest -v \
            --junitxml=test-results/junit.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html || true

          echo ""
          echo "Validating Python syntax..."
          python -m py_compile main.py
          echo "✓ Syntax validation passed"

          echo ""
          echo "✓ Backend tests completed"

      - name: Upload test results to Launchable
        if: always()
        uses: docker://cloudbees/launchable:v1.120.0
        shell: sh
        env:
          LAUNCHABLE_TOKEN: ${{ secrets.SMART_TESTS_KEY }}
        run: |
          cd source
          launchable record tests --build ${CLOUDBEES_RUN_ID} pytest test-results/junit.xml
