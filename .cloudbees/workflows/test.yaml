apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test
on:
  workflow_dispatch:
  workflow_call:
permissions:
  scm-token-own: read
  scm-token-org: read
jobs:
  test:
    steps:
      - name: Check out
        uses: cloudbees-io/checkout@v2
        with:
          path: source
          fetch-depth: 0

      - name: Record build with Launchable
        uses: docker://cloudbees/launchable:v1.120.0
        shell: sh
        env:
          LAUNCHABLE_TOKEN: ${{ secrets.SMART_TESTS_KEY }}
        run: |
          cd source
          git config --global --add safe.directory /cloudbees/workspace/source
          NAME=$(git rev-parse --short HEAD)
          launchable record build --name $NAME --source=src=.

      - name: Create test session
        uses: docker://cloudbees/launchable:v1.120.0
        shell: sh
        env:
          LAUNCHABLE_TOKEN: ${{ secrets.SMART_TESTS_KEY }}
        run: |
          cd source
          NAME=$(git rev-parse --short HEAD)
          launchable record session --test-suite backend-api --build $NAME > launchable-session.txt
          cat launchable-session.txt

      - name: Run tests
        uses: docker://python:3.11-slim
        shell: sh
        run: |
          set -eu
          cd source

          echo "========================================"
          echo "Backend Tests with Launchable"
          echo "========================================"
          echo ""

          echo "Installing dependencies..."
          pip install --quiet --no-cache-dir -r requirements.txt
          pip install --quiet --no-cache-dir -r requirements-dev.txt

          echo ""
          echo "Running tests with JUnit output..."
          mkdir -p test-results
          # Run pytest with JUnit XML output for Launchable
          pytest -v --junitxml=test-results/junit.xml

          echo ""
          echo "✓ Backend tests completed"

      - name: Upload test results to Launchable
        if: always()
        uses: docker://cloudbees/launchable:v1.120.0
        shell: sh
        env:
          LAUNCHABLE_TOKEN: ${{ secrets.SMART_TESTS_KEY }}
        run: |
          cd source
          launchable record tests --session $(cat launchable-session.txt) pytest test-results/

      - name: Publish test results
        if: always()
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: JUNIT
          results-path: source/test-results/junit.xml
