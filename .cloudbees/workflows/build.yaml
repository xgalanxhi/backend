apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: build

on:
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.build-and-push.outputs.artifact-id }}
      image:
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: read

jobs:
  build-and-push:
    outputs:
      artifact-id: ${{ cloudbees.version }}
      image: ${{ vars.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ cloudbees.version }}
    steps:
      - name: Check out
        id: checkout
        uses: cloudbees-io/checkout@v2
        with:
          path: source

      - name: Configure DockerHub credentials
        id: dockerconfig
        uses: cloudbees-io/configure-oci-credentials@v1
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image (Kaniko)
        id: kaniko-build
        uses: cloudbees-io/kaniko@v1
        kind: build
        with:
          context: source
          dockerfile: Dockerfile
          destination: ${{ vars.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ cloudbees.version }}

      - name: Print pushed artifact ID
        uses: docker://alpine:latest
        shell: sh
        env:
          DESTINATION: ${{ vars.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ cloudbees.version }}
        run: |
          echo "artifact ID for '${DESTINATION}': ${{ fromJSON(steps.kaniko-build.outputs.artifact-ids)[env.DESTINATION] }}"

      - name: Publish build evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |
            ## Docker Image Build

            **Image**: `${{ vars.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ cloudbees.version }}`
            **Artifact ID**: `${{ fromJSON(steps.kaniko-build.outputs.artifact-ids)[format('{0}/{1}/{2}:{3}', vars.DOCKER_REGISTRY, secrets.DOCKER_USERNAME, vars.DOCKERHUB_REPO, cloudbees.version)] }}`
            **Registry**: `${{ vars.DOCKER_REGISTRY }}`
            **Build Time**: `${{ cloudbees.scm.sha }}`
