apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test-oidc

on:
  workflow_dispatch:

permissions:
  id-token: read
  scm-token-own: read
  scm-token-org: read

jobs:
  check-oidc:
    steps:
      - name: Check OIDC token and permissions
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "=== Checking OIDC Token Availability ==="

          # Check if ACTIONS_ID_TOKEN_REQUEST_URL is set (GitHub Actions OIDC)
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "✓ ACTIONS_ID_TOKEN_REQUEST_URL is set"
            echo "  URL: ${ACTIONS_ID_TOKEN_REQUEST_URL}"
          else
            echo "✗ ACTIONS_ID_TOKEN_REQUEST_URL is not set"
          fi

          # Check if ACTIONS_ID_TOKEN_REQUEST_TOKEN is set
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "✓ ACTIONS_ID_TOKEN_REQUEST_TOKEN is set"
            echo "  Token length: ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          else
            echo "✗ ACTIONS_ID_TOKEN_REQUEST_TOKEN is not set"
          fi

          echo ""
          echo "=== CloudBees Context Variables ==="
          echo "cloudbees.organization: ${CLOUDBEES_ORGANIZATION:-<not set>}"
          echo "cloudbees.workspace: ${CLOUDBEES_WORKSPACE:-<not set>}"
          echo "cloudbees.scm.repository: ${CLOUDBEES_SCM_REPOSITORY:-<not set>}"
          echo "cloudbees.scm.ref: ${CLOUDBEES_SCM_REF:-<not set>}"

          echo ""
          echo "=== Permissions Granted ==="
          echo "This workflow has the following permissions:"
          echo "  - id-token: read"
          echo "  - scm-token-own: read"
          echo "  - scm-token-org: read"

          echo ""
          echo "=== Environment Variables (filtered) ==="
          env | grep -E '^(CLOUDBEES_|AWS_|ACTIONS_)' | sort || echo "No CloudBees/AWS/Actions env vars found"

          echo ""
          echo "=== Attempting to decode OIDC token (if available) ==="
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "Attempting to fetch OIDC token..."
            apk add --no-cache curl jq

            # Try to get the token
            TOKEN_RESPONSE=$(curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" || echo "")

            if [ -n "$TOKEN_RESPONSE" ]; then
              echo "✓ Successfully fetched OIDC token"

              # Extract the token value
              OIDC_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value // empty')

              if [ -n "$OIDC_TOKEN" ]; then
                echo "Token value received (truncated): ${OIDC_TOKEN:0:50}..."

                # Decode JWT payload (base64 decode the middle part)
                PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d'.' -f2)
                # Add padding if needed
                case $((${#PAYLOAD} % 4)) in
                  2) PAYLOAD="${PAYLOAD}==" ;;
                  3) PAYLOAD="${PAYLOAD}=" ;;
                esac

                echo ""
                echo "=== JWT Token Claims ==="
                echo "$PAYLOAD" | base64 -d 2>/dev/null | jq . || echo "Could not decode token payload"
              else
                echo "✗ No token value in response"
                echo "Response: $TOKEN_RESPONSE"
              fi
            else
              echo "✗ Failed to fetch OIDC token"
            fi
          else
            echo "OIDC token endpoint not available - this is expected for CloudBees Unify"
            echo "CloudBees may use a different authentication mechanism"
          fi

          echo ""
          echo "=== AWS Configuration (if available) ==="
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "✓ AWS_ACCESS_KEY_ID is set"
          else
            echo "✗ AWS_ACCESS_KEY_ID is not set"
          fi

          if [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "✓ AWS_SECRET_ACCESS_KEY is set"
          else
            echo "✗ AWS_SECRET_ACCESS_KEY is not set"
          fi

          if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "✓ AWS_SESSION_TOKEN is set (temporary credentials)"
          else
            echo "✗ AWS_SESSION_TOKEN is not set"
          fi

          echo ""
          echo "=== Test Complete ==="
